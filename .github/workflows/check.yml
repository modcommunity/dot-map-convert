name: Check

on:
    push:
        branches: ['**']
        paths-ignore: ['**/*.md']
    pull_request:
    workflow_dispatch:

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: dot-map-convert
            - uses: actions/checkout@v4
              with:
                  repository: modcommunity/dot-map
                  path: dot-map
            - name: Python dependencies
              run: |
                  python3 -m venv "$HOME/venv"
                  "$HOME/venv/bin/pip" install -q numpy scipy pillow trimesh matplotlib
                  echo "$HOME/venv/bin" >> "$GITHUB_PATH"
            - name: Suites
              working-directory: dot-map-convert
              run: |
                  fail=0
                  for t in tests/test_*.py; do python3 -P "$t" > /tmp/t.log 2>&1 || { echo "FAIL $t"; tail -5 /tmp/t.log; fail=1; }; done
                  exit $fail
            - name: Adapters compile
              working-directory: dot-map-convert
              run: python3 -P -m compileall -q adapters
